# Сборка функции админки для Yandex Cloud Functions.
# Результат — архив function.zip во вкладке Actions (Artifacts). Загружается в функцию вручную:
# у сборки специально НЕТ доступа к Yandex Cloud, чтобы взлом репозитория не давал управления админкой.
name: Сборка админки

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'shared/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Тесты защиты
        run: npm run admin:test
      - name: Сборка
        run: |
          npm run admin:build
          cd admin/dist/function && zip -q -X ../function.zip index.js
          echo "SHA-256 архива: \`$(sha256sum ../function.zip | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-function
          path: admin/dist/function.zip
          retention-days: 14
