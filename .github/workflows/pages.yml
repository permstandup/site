# Сборка сайта и выкладка на GitHub Pages (бесплатно; временно, до переезда в Yandex Cloud).
# Запускается: при каждом изменении, каждую ночь в 00:05 по Перми (чтобы прошедшие шоу
# уходили из афиши) и вручную (Actions → «Публикация сайта (GitHub Pages)» → Run workflow).
name: Публикация сайта (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'admin/**'
      - '**/*.md'
      - 'admin-state.json'
  schedule:
    - cron: '5 19 * * *' # 19:05 UTC = 00:05 по Перми
  workflow_dispatch:

# Минимум прав: читать код и публиковать в Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: пакеты не могут выполнить свой код при установке
      - name: Установка зависимостей
        run: npm ci --ignore-scripts

      - name: Проверки (схемы данных и защита админки)
        run: npm run admin:test

      - name: Сборка сайта
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
